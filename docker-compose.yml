# Crash & Learn — notre configuration Docker.
#
# Le simulateur d'Epitech est construit dans l'image (son Dockerfile fait COPY . /app)
# et n'est pas monté depuis le disque : il ne bouge pas, et on ne le modifie jamais.
# Seuls nos propres dossiers sont montés, pour que le code et les modèles soient
# visibles dans le conteneur sans reconstruire l'image à chaque changement.
#
# Conséquence : `simulation/` n'est pas versionné. Chaque membre télécharge l'archive
# d'Epitech et la décompresse ici — voir CONTRIBUTING.md.

# Notre image = celle d'Epitech + la pile d'entraînement. Versions exactes : une
# dépendance flottante finit par tirer un numpy ou un torch différent, et c'est
# toute la chaîne ONNX épinglée en dessous qui saute. pip ne touche à rien d'autre.
x-service: &service
  build:
    context: .
    additional_contexts:
      base: service:base
    dockerfile_inline: |
      FROM base
      RUN pip install --no-cache-dir \
          "gymnasium==1.4.0" \
          "stable-baselines3==2.9.2"
  image: crashlearn-sim:train
  working_dir: /app
  environment:
    MPLBACKEND: Agg
  volumes:
    - ./training:/app/training
    - ./submission:/app/submission
    - ./runs:/app/runs
    - ./archives:/app/archives
    - ./recordings:/app/recordings

services:

  # L'image d'Epitech telle quelle, construite seulement pour servir de base.
  base:
    build:
      context: ./simulation
      target: base
    image: crashlearn-sim:base

  sim:
    <<: *service
    command: python demo.py

  recorder:
    <<: *service
    command: python sim_recorder.py --steps 500 --num-cars 1 --out /app/recordings/episode.npz

  replay:
    <<: *service
    command: python viz_replay.py --npz /app/recordings/episode.npz

  # Seul service qui reste allumé : lancé par `make board`, il redémarre avec Docker
  # jusqu'à `make board-stop`. Il lit deux dossiers, préfixés dans l'interface :
  # archives/ (runs gardés, versionnés) et runs/ (brouillon local).
  tensorboard:
    <<: *service
    restart: unless-stopped
    ports:
      - "6006:6006"
    command: tensorboard --logdir_spec archives:/app/archives,local:/app/runs --host 0.0.0.0 --port 6006
