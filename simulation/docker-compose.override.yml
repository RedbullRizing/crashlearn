# Rend notre code et notre livrable visibles depuis le conteneur.
#
# docker-compose.yml ne monte que simulation/ (`- .:/app`). training/, submission/,
# logs/ et runs/ vivent à la racine du dépôt : sans ces montages ils sont hors du
# conteneur, donc ni entraînables ni vérifiables.
#
# Compose fusionne ce fichier automatiquement avec celui fourni par Epitech, qui
# reste inchangé — une mise à jour de leur part ne crée aucun conflit.

services:

  sim:
    volumes:
      - ../training:/app/training
      - ../submission:/app/submission
      - ../logs:/app/logs
      - ../runs:/app/runs

  recorder:
    volumes:
      - ../training:/app/training
      - ../submission:/app/submission
      - ../recordings:/app/recordings

  replay:
    volumes:
      - ../submission:/app/submission
      - ../recordings:/app/recordings

  tensorboard:
    volumes:
      - ../logs:/app/logs
      - ../runs:/app/runs
