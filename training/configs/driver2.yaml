# Réglages d'entraînement du pilote driver2 : `make train DRIVER=driver2`.
#
# Chacun fait diverger son pilote ici, sans toucher à env.py ni train.py. Une
# option de la ligne de commande (PAS=, ENVS=, GRAINE=) l'emporte sur ce fichier.
# La configuration effective de chaque run est recopiée dans son meta.json.
#
# Pilote livré : PPO 64x64, 8 192 pas par mise à jour (n_steps 1024), 20 passes par
# mise à jour (n_epochs), choc à 10, un choc ne coupe pas l'épisode.
# Run driver2-20261124-233935-ppo, série 5 (CRA-107).
#
# Série 5 (CRA-107) : remplit la règle (moyenne 44,50, min 44, 190,1 s sous 0,7),
# 10 % plus rapide que le pilote précédent (série 4) ; point faible : stagnations
# sous la pluie à Montréal et Monza.

graine: 21           # graine 21, retenue dans la série 5 : seule à remplir la règle de CRA-107
pas: 800000          # 98 mises à jour de 8 192 pas : le run s'arrête à 802 816 pas (série 5, CRA-107)
envs: 8              # un pilote à la fois, un environnement par cœur
eval_episodes: 2     # par circuit de validation : une course au sec, une sous la pluie

ppo:
  n_steps: 1024      # × 8 envs = 8 192 pas par mise à jour
  batch_size: 64
  gamma: 0.995
  learning_rate: 0.0003
  ent_coef: 0.005
  n_epochs: 20

env:
  pas_max: 3000      # troncature d'un épisode (150 s)
  fin_sur_choc: false # entraînement seulement : false = un choc ne coupe pas l'épisode (en course, un choc n'élimine jamais)
  meteo: true        # adhérence et bruit LiDAR tirés toutes les 20 s
  adversaires: []

recompense:          # poids de la récompense par pas, voir training/env.py
  cout_temps: 0.01
  poids_douceur: 0.05
  penalite_choc: 10.0
  penalite_contact: 1.0
  penalite_dnf: 10.0
