# Réglages d'entraînement du pilote driver1 : `make train DRIVER=driver1`.
#
# Chacun fait diverger son pilote ici, sans toucher à env.py ni train.py. Une
# option de la ligne de commande (PAS=, ENVS=, GRAINE=) l'emporte sur ce fichier.
# La configuration effective de chaque run est recopiée dans son meta.json.
#
# Référence du MDP v2 : poids par défaut.

graine: 1
pas: 500000         # 300 000 pas finissaient déjà 6 courses de validation sur 6
envs: 8              # un pilote à la fois, un environnement par cœur
eval_episodes: 2     # par circuit de validation : une course au sec, une sous la pluie

ppo:
  n_steps: 256       # × 8 envs = 2 048 pas par mise à jour
  batch_size: 64
  gamma: 0.99
  learning_rate: 0.0003

env:
  pas_max: 3000      # troncature d'un épisode (150 s)
  fin_sur_choc: true # un choc contre un mur termine l'épisode
  meteo: true        # adhérence et bruit LiDAR tirés toutes les 20 s
  adversaires: []

recompense:          # poids de la récompense par pas, voir training/env.py
  cout_temps: 0.01
  poids_douceur: 0.05
  penalite_choc: 2.0
  penalite_contact: 1.0
  penalite_dnf: 10.0
